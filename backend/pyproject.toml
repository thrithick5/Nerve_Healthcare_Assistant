name = "ai-healthcare-assistant"
version = "2.0.0"
description = "Production-ready AI Healthcare Assistant with Qdrant, PostgreSQL, and real-time WebSocket chat"
authors = ["AI Healthcare Team"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
api-server = "app.main:app"
health-check = "scripts.health_check:main"
