databases:
  - name: nerve-healthcare-db
    plan: free
    databaseName: nerve_healthcare
    user: nerve

services:
  - type: web
    name: nerve-healthcare-backend
    env: docker
    repo: https://github.com/thrithick5/Nerve_Healthcare_Assistant
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nerve-healthcare-db
          property: connectionString
      - key: CHROMA_PERSIST_DIR
        value: /app/data/chroma_db
      - key: COLLECTION_NAME
        value: medical_knowledge
      - key: MISTRAL_MODEL
        value: mistral-large-latest
      - key: MISTRAL_EMBEDDING_MODEL
        value: mistral-embed
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS_EXTRA
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SECRET_KEY
        sync: false
